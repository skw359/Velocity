name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 20 is the oldest version package.json supports; 24 is what install.sh deploys.
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      # Lets the media tests run the real ffmpeg on a hostile filename, not just a stand-in.
      - name: Install ffmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install server dependencies
        run: npm ci

      - name: Check server syntax
        shell: bash
        run: for f in *.js routes/*.js tests/*.js tests/support/*.js; do node --check "$f"; done

      - name: Run server tests
        run: npm test

  client:
    name: Client lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Lint client
        working-directory: client
        run: npm run lint

      - name: Build client
        working-directory: client
        run: npm run build
